[pytest]
# only look for tests under the top-level `test` directory
# (this prevents grabbing stray modules inside src/, especially
# `src/computer_vision_desatendida/test_vision.py` which triggers
# import errors during collection).
testpaths = test

# our files follow these patterns:
# - test_*.py (typical)
# - *_test.py (typical)
# - 4_1_##_test_*.py (phase-based tests)
python_files = test_*.py *_test.py *_test_*.py

# do not recurse into the source package at all
norecursedirs = src
